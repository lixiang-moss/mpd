# adapter=mpd: defines MPD artifact filenames and parsing priority.

type: mpd
# If prefer_jsonl=true and trial_metrics.jsonl exists, parse JSONL first (lighter-weight).
prefer_jsonl: true
# Recommended lightweight output: one JSON object per trial.
trial_metrics_jsonl: trial_metrics.jsonl
# Optional: if MPD adds run_summary.yaml in the future, it could speed up candidate aggregation (unused currently).
run_summary_yaml: run_summary.yaml
# MPD inference writes args_inference.yaml (used to fill metadata like planner_alg / diffusion_sampling_method).
args_inference_yaml: args_inference.yaml
# Fallback: if JSONL is missing, scan results_single_plan-*.pt and parse via torch.load.
results_pt_glob: results_single_plan-*.pt
