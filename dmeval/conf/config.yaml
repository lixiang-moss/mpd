# Default DMEval main config (example).
# Recommended: copy it (e.g. to config_mpd.yaml) and modify for your experiment needs.

defaults:
  # `defaults` composes sub-configs via Hydra.
  # L1 principle: Hydra is used only for compose/overrides; it does not manage cwd/outputs.
  - planner: mpd
  - adapter: mpd
  - objective: lexicographic
  - _self_

pipeline:
  # Root directory for all outputs (strongly recommended to use a fresh dir per run).
  root: outputs/dmeval_${now:%Y-%m-%d_%H-%M-%S}
  # When allow_overwrite=false and the root exists, fail fast (protects experiment artifacts).
  allow_overwrite: false

common_inference_args:
  # These args are appended by runner.py to the planner command line (aligned with MPD inference args).
  selection_start_goal: validation
  # N: number of trials within a single run (number of start-goal states).
  n_start_goal_states: 5
  save_results_single_plan_low_mem: true
  device: cpu

tune:
  # Stage I: tuning stage (single scenario).
  enabled: true
  stage_dir: tune
  scenario:
    # Scenario name for CSV/records (does not need to match MPD exactly).
    name: spheres3d_panda
    # base_cfg: system-under-test (MPD) inference config file path.
    base_cfg: mpd-splines-public/scripts/inference/cfgs/config_EnvSpheres3D-RobotPanda_00.yaml
  # For development you can use a single seed; for papers use multiple seeds for robustness.
  seeds: [2]
  # Output top-k per sampler (and write best_patch.yaml as Stage II input).
  top_k: 3
  # "Tune multiple samplers": samplers listed here are tuned serially in order.
  samplers:

  
    - name: ddim
      # patch_base: fixed overrides required by this sampler (e.g., diffusion_sampling_method).
      patch_base:
        diffusion_sampling_method: ddim
      search:
        # Search strategy: grid/random/optuna (this minimal build implements grid/random).
        strategy: grid
        space:
          # `space` uses dotpaths for fields to override (generates patch.yaml merged into base_cfg).
          ddim.ddim_sampling_timesteps: [10, 15]
          ddim.ddim_eta: [0.0, 0.5]
          ddim.n_guide_steps: [2, 4]


    - name: dpm_solver_pp
      patch_base:
        # Note: in MPD, diffusion_sampling_method may still be `dpm_solver`;
        # dpmsolver++ is distinguished via dpm_solver_algorithm_type (follow MPD config conventions).
        diffusion_sampling_method: dpm_solver
        dpm_solver:
          dpm_solver_algorithm_type: dpmsolver++
      search:
        strategy: grid
        space:
          dpm_solver.dpm_solver_steps: [16, 26]
          dpm_solver.dpm_solver_order: [2]
          dpm_solver.prior_weight_with_guide: [0.95, 1.05]

compare:
  # Stage II: fair comparison stage (multiple scenarios).
  enabled: true
  stage_dir: compare
  # Stage II reads Stage-I best_configs from here.
  best_configs_root: ${pipeline.root}/best_configs
  seeds: [2]
  # Multi-scenario comparison: each scenario provides an MPD base_cfg (Stage II applies best_patch to it).
  scenarios:
    - name: spheres3d_panda
      base_cfg: mpd-splines-public/scripts/inference/cfgs/config_EnvSpheres3D-RobotPanda_00.yaml
    - name: planar2link
      base_cfg: mpd-splines-public/scripts/inference/cfgs/config_EnvPlanar2Link-RobotPlanar2Link_00.yaml
