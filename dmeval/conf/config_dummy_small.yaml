# Minimal dummy end-to-end config:
# - Uses `dmeval/scripts/dummy_planner.py` instead of MPD
# - For quick smoke tests/unit tests (validates DMEval call chain and artifact contract)

defaults:
  - planner: dummy
  - adapter: mpd
  - objective: lexicographic
  - _self_

pipeline:
  # For tests/smoke checks, consider using a `.tmp/` root to avoid polluting real experiment outputs.
  root: outputs/dmeval_dummy_small_${now:%Y-%m-%d_%H-%M-%S}
  allow_overwrite: false

common_inference_args:
  selection_start_goal: validation
  n_start_goal_states: 2
  save_results_single_plan_low_mem: true
  device: cpu

tune:
  enabled: true
  stage_dir: tune
  scenario:
    name: planar2link
    # `base_cfg` is only used by dummy_planner to read a few fields (it does not run MPD).
    base_cfg: mpd-splines-public/scripts/inference/cfgs/config_EnvPlanar2Link-RobotPlanar2Link_00.yaml
  seeds: [2]
  top_k: 1
  samplers:
    - name: ddim
      patch_base:
        diffusion_sampling_method: ddim
      search:
        strategy: grid
        space:
          ddim.ddim_sampling_timesteps: [10]
          ddim.ddim_eta: [0.0]

compare:
  enabled: true
  stage_dir: compare
  best_configs_root: ${pipeline.root}/best_configs
  seeds: [2]
  scenarios:
    - name: planar2link
      base_cfg: mpd-splines-public/scripts/inference/cfgs/config_EnvPlanar2Link-RobotPlanar2Link_00.yaml
