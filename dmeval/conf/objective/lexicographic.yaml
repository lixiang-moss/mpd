# objective=lexicographic:
# - apply constraint threshold filtering first (infeasible candidates are rejected)
# - then rank within the feasible set by a lexicographic key (multi-metric ordering)

mode: lexicographic
constraints:
  # These fields come from candidate_metrics.csv (i.e., trial-level aggregated *_mean columns).
  - field: success_mean
    op: ge
    value: 0.8
  - field: fraction_valid_mean
    op: ge
    value: 0.6
  - field: collision_intensity_mean
    op: le
    value: 0.05
# Sort within feasible set by the following keys (priority decreases from top to bottom).
lexicographic_key:
  - field: success_mean
    order: desc
    nan: low
  - field: collision_intensity_mean
    order: asc
    nan: high
  - field: t_inference_total_mean
    order: asc
    nan: high
  - field: path_length_best_mean
    order: asc
    nan: high
