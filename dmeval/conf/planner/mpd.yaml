# planner=mpd: defines how DMEval invokes the system-under-test (MPD).
# Note: entrypoint/workdir are configured here (not hard-coded in Python), following the L1 principle.

name: mpd
python: python3
# entrypoint: MPD inference entry script (relative to repo root).
entrypoint: mpd-splines-public/scripts/inference/inference.py
# workdir: subprocess working directory (cwd), so MPD-relative paths resolve correctly.
workdir: mpd-splines-public
# extra_args: extra CLI args passed through (prefer base_cfg/patch instead of hard-coding here).
extra_args: []
