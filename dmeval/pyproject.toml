[build-system]
# 构建系统（如果你选择 pip 安装/打包）。
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dmeval"
version = "0.1.0"
description = "DMEval vNext: serial evaluation pipeline for diffusion sampler benchmarking"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  # DMEval 侧最小依赖：
  # - hydra-core/omegaconf：配置组合（compose API）
  # - PyYAML：读写 yaml（base_cfg/patch/manifest）
  # - pandas：聚合 trial/run/candidate 指标
  # - matplotlib：输出基础图表（plots/*.png）
  "hydra-core>=1.3.2",
  "omegaconf>=2.3.0",
  "PyYAML>=6.0.1",
  "pandas>=1.5.0",
  "matplotlib>=3.7.0",
]

[project.optional-dependencies]
# 可选依赖：未来把 optuna（TPE/贝叶斯）搜索策略接入 Stage I 时使用。
optuna = ["optuna>=3.5.0"]

[project.scripts]
# 如果你把包安装到环境里，可以直接用 `dmeval ...`。
dmeval = "dmeval.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
