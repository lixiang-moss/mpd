[build-system]
# Build system (used if you install/package via pip).
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dmeval"
version = "0.1.0"
description = "DMEval vNext: serial evaluation pipeline for diffusion sampler benchmarking"
readme = "README.md"
# Aligned with the devcontainer MPD environment (python=3.8.19).
requires-python = ">=3.8,<3.9"
dependencies = [
  # Minimal DMEval dependencies:
  # - hydra-core/omegaconf: config composition (compose API)
  # - PyYAML: YAML read/write (base_cfg/patch/manifests)
  # - pandas: aggregate trial/run/candidate metrics
  # - matplotlib: output basic plots (plots/*.png)
  "hydra-core>=1.3.2",
  "omegaconf>=2.3.0",
  "PyYAML>=6.0.1",
  "pandas>=1.5.0",
  "matplotlib>=3.7.0",
]

[project.optional-dependencies]
# Optional deps: for integrating optuna (TPE/Bayesian) search into Stage I in the future.
optuna = ["optuna>=3.5.0"]

[project.scripts]
# If you install the package into an environment, you can run `dmeval ...` directly.
dmeval = "dmeval.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
