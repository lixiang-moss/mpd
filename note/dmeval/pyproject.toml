[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dmeval"
version = "0.1.0"
description = "Decoupled evaluation framework for motion planning (with an MPD adapter)."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "PyYAML>=5.4",
  "hydra-core>=1.3",
]

[project.optional-dependencies]
# Optional: collect MPD `.pt` outputs (requires torch + dotmap at runtime).
mpd = ["torch", "dotmap"]
# Optional: plotting helpers.
plot = ["matplotlib"]

[project.scripts]
dmeval = "dmeval.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
